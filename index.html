<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Pong 2 Players</title>
  
  <!-- Estilos y Miniatura -->
  <link rel="stylesheet" href="style.css">
  <meta property="og:image" content="preview.png">
</head>
<body>

  <div class="game-container">
    <h1>CHAOS PONG</h1>
    
    <div class="score-board">
      <div class="player-score P1">Jugador 1 (W/S): <span id="score1">0</span></div>
      <div class="player-score P2">Jugador 2 (▲/▼): <span id="score2">0</span></div>
    </div>

    <canvas id="pongCanvas" width="800" height="400"></canvas>

    <div class="controls-info">
      <p>🔴 <b>J1:</b> Teclas <b>W</b> y <b>S</b> | 🔵 <b>J2:</b> Flechas <b>Arriba</b> y <b>Abajo</b></p>
      <div class="buttons-group">
        <button id="addBallBtn">🔥 Añadir Pelota Extra</button>
        <button id="resetBtn">🔄 Reiniciar Partido</button>
      </div>
    </div>
  </div>

  <!-- Lógica del juego -->
  <script src="script.js"></script>
</body>
</html>
